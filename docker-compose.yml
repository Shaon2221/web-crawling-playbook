version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: books-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: books_crawler
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - books-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Books Crawler API
  crawler-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: books-crawler-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - API_HOST=0.0.0.0
      - API_PORT=8000
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - books-network
    command: python -m src api

  # Crawler Worker (optional - for background crawling)
  crawler-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: books-crawler-worker
    restart: "no"
    env_file:
      - .env
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - books-network
    command: python -m src crawl
    profiles:
      - crawl

  # Mongo Express (optional - for database management UI)
  mongo-express:
    image: mongo-express:1.0.2
    container_name: books-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongodb:27017
      ME_CONFIG_BASICAUTH: false
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - books-network
    profiles:
      - dev

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local

networks:
  books-network:
    driver: bridge
