version: "3.9"

services:
  # MongoDB database
  mongodb:
    image: mongo:6.0
    container_name: books_scraper_mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: books_scraper
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - books_network
    restart: unless-stopped

  # Redis for rate limiting
  redis:
    image: redis:7-alpine
    container_name: books_scraper_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - books_network
    restart: unless-stopped

  # FastAPI application
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: books_scraper_api
    ports:
      - "8000:8000"
    environment:
      MONGO_URI: mongodb://mongodb:27017
      MONGO_DB: books_scraper
      REDIS_URL: redis://redis:6379
      API_HOST: 0.0.0.0
      API_PORT: 8000
      LOG_LEVEL: INFO
      CRAWLER_TIMEOUT: 30
      CRAWLER_MAX_RETRIES: 3
      CRAWLER_BACKOFF_FACTOR: 2.0
      RATE_LIMIT_REQUESTS: 100
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./logs:/app/logs
    networks:
      - books_network
    restart: unless-stopped

  # Scheduler service (runs daily crawl)
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.scheduler
    container_name: books_scraper_scheduler
    environment:
      MONGO_URI: mongodb://mongodb:27017
      MONGO_DB: books_scraper
      SCHEDULER_ENABLED: "true"
      LOG_LEVEL: INFO
      CRAWLER_TIMEOUT: 30
      CRAWLER_MAX_RETRIES: 3
      CRAWLER_BACKOFF_FACTOR: 2.0
      SCHEDULER_INTERVAL_HOURS: 24
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./scripts:/app/scripts
      - ./logs:/app/logs
    networks:
      - books_network
    restart: unless-stopped

volumes:
  mongo_data:
  mongo_config:
  redis_data:

networks:
  books_network:
    driver: bridge
